name: CI

# Cloudflare's Git integration already builds and deploys main on push, so this
# workflow deliberately does NOT deploy — two deploy paths on one commit race
# each other. What was missing is a gate: rebuild every generated file from the
# transcriptions and fail the PR if anything is stale, invalid, or inconsistent.
#
# It uses no marketplace actions. actions/checkout and actions/setup-node were
# here originally and the job spent days failing in "Set up job" with "Failed to
# resolve action download info / Service Unavailable" — GitHub could not serve
# the actions themselves, so not one step of ours ever ran. Nothing here needs
# them: the runner ships git, node and npm, and a shallow fetch of one commit is
# four lines. Fewer moving parts between a push and an answer.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit under test
        env:
          GH_TOKEN: ${{ github.token }}
          # On a pull_request event github.sha is the merge commit. The staleness
          # check is about what was actually committed, so take the branch head.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch -q --depth=1 origin "$SHA"
          git checkout -q FETCH_HEAD
          echo "Checked out $SHA"

      - name: Report the toolchain
        run: |
          node --version
          npm --version
          # The build scripts are plain ES modules; anything modern will do.
          major=$(node -p "process.versions.node.split('.')[0]")
          if [ "$major" -lt 20 ]; then
            echo "::error::Node 20 or newer required, runner has $(node --version)"
            exit 1
          fi

      - run: npm ci

      - name: Rebuild the roster from the transcriptions
        run: npm run build:roster

      - name: Rebuild the timeline from the transcriptions
        run: npm run build:timeline

      - name: Rebuild the map-sheet register from the transcriptions
        run: npm run build:maps

      # Offline: it reads the committed data/weather.json, it does not refetch.
      # Only `npm run weather:fetch` touches the network, and CI never runs it.
      - name: Rebuild the modelled weather from the committed pull
        run: npm run build:weather

      - name: Validate timeline.json and the modelled weather
        run: npm run check:data

      # The lettered squares in tools/lib/grids.mjs are derived from the reports.
      # If a newly transcribed frame moves a square, the committed anchors are
      # wrong and every decoded position moves with them, so re-derive and fail
      # on any disagreement rather than let it pass silently.
      - name: Re-derive the grid squares from the reports
        run: |
          out=$(npm run --silent derive:grids)
          echo "$out"
          if echo "$out" | grep -q "differs from tools/lib/grids.mjs"; then
            echo "::error::A lettered square derived from the reports no longer matches tools/lib/grids.mjs."
            exit 1
          fi

      # The generated files are committed so the Worker can serve them without a
      # build step. That only works if they match their sources — if a rebuild
      # changes anything, the commit is stale and the PR should say so.
      - name: Fail if generated files are stale
        run: |
          if ! git diff --quiet -- public/data; then
            echo "::error::public/data is out of date. Run 'npm run build:roster && npm run build:timeline && npm run build:maps && npm run build:weather' and commit the result."
            git diff --stat -- public/data
            exit 1
          fi
          echo "Generated files match their transcriptions."

  # To let GitHub own the deploy instead of Cloudflare's Git integration:
  # disconnect that integration first, then uncomment this and add
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets.
  # Running both is what you want to avoid — they race on the same commit.
  #
  # deploy:
  #   needs: check
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - env:
  #         GH_TOKEN: ${{ github.token }}
  #       run: |
  #         git init -q .
  #         git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
  #         git -c protocol.version=2 fetch -q --depth=1 origin "$GITHUB_SHA"
  #         git checkout -q FETCH_HEAD
  #     - run: npm ci
  #     - run: npx wrangler deploy
  #       env:
  #         CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  #         CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
